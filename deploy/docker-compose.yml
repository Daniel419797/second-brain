services:
  friday-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      JARVIS_API_USERNAME: friday
      JARVIS_API_PASSWORD: ${JARVIS_API_PASSWORD:?set JARVIS_API_PASSWORD}
      JARVIS_API_SECRET: ${JARVIS_API_SECRET:?set JARVIS_API_SECRET}
      FRIDAY_API_CORS_ORIGINS: ${FRIDAY_API_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      FRIDAY_PRODUCTION_URL: ${FRIDAY_PRODUCTION_URL:-}
      DATABASE_URL: ${DATABASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      GOOGLE_SEARCH_API_KEY: ${GOOGLE_SEARCH_API_KEY:-}
      GOOGLE_SEARCH_CX: ${GOOGLE_SEARCH_CX:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      IMAGE_GENERATION_PROVIDER: ${IMAGE_GENERATION_PROVIDER:-pollinations}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_IMAGE_MODEL: ${HF_IMAGE_MODEL:-stabilityai/stable-diffusion-xl-base-1.0}
      MESHY_API_KEY: ${MESHY_API_KEY:-}
      TRIPO_API_KEY: ${TRIPO_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - friday-data:/app/data
    restart: unless-stopped

  friday-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        NEXT_PUBLIC_FRIDAY_API_URL: ${NEXT_PUBLIC_FRIDAY_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - friday-api
    restart: unless-stopped

volumes:
  friday-data:
