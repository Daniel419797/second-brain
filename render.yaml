services:
  - type: web
    name: friday-api
    runtime: docker
    dockerfilePath: deploy/Dockerfile.api
    plan: starter
    envVars:
      - key: JARVIS_API_USERNAME
        value: friday
      - key: JARVIS_API_PASSWORD
        sync: false
      - key: JARVIS_API_SECRET
        generateValue: true
      - key: FRIDAY_API_CORS_ORIGINS
        sync: false
      - key: FRIDAY_AUTONOMY_MODE
        value: full
      - key: FRIDAY_AUTONOMY_TRUSTED_ROOTS
        value: Desktop
      - key: FRIDAY_API_RUNTIME_SERVICES
        value: "1"
      - key: FRIDAY_PRODUCTION_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: GOOGLE_SEARCH_API_KEY
        sync: false
      - key: GOOGLE_SEARCH_CX
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: IMAGE_GENERATION_PROVIDER
        value: pollinations
      - key: HF_TOKEN
        sync: false
      - key: MESHY_API_KEY
        sync: false
      - key: TRIPO_API_KEY
        sync: false
    disk:
      name: friday-data
      mountPath: /app/data
      sizeGB: 1

  - type: web
    name: friday-web
    runtime: docker
    dockerfilePath: deploy/Dockerfile.web
    plan: starter
    envVars:
      - key: NEXT_PUBLIC_FRIDAY_API_URL
        sync: false
